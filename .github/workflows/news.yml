name: Fetch news

# 毎時ニュースを取得して data/news.json を更新します。
# 閲覧側は同一オリジンの data/news.json を読むだけなので、CORSプロキシに
# 依存せず、会社ネットワークなど制限環境でも安定して表示できます。
on:
  schedule:
    - cron: "17 * * * *"    # 毎時 17 分（UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch news
        run: node scripts/fetch-news.mjs

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update news data [skip ci]"
            git push
          fi
