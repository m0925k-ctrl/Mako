  .view-sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .view { display: none; }
  .view.active { display: block; }

  h2.sec { font-size: 15px; font-weight: 700; margin: 4px 0 12px; letter-spacing: .02em; }

  .rcard {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }

    list-style: none; cursor: pointer; padding: 13px 15px;
    display: flex; align-items: center; gap: 12px;

  .rcard > summary::after { content: "⌄"; margin-left: auto; color: var(--faint); font-size: 18px; transition: transform .18s; }

  .rcard .head-main { min-width: 0; }

  .rcard .head-main .m { color: var(--muted); font-size: 12.5px; }
  .rcard .body { padding: 4px 15px 16px; border-top: 1px solid var(--border); }

  .prio-中 { color: var(--warn); }
  .prio-低 { color: var(--faint); }

  .tline .meta { color: var(--faint); font-size: 12px; }
  .overdue { color: var(--crit); font-weight: 700; }

  .ai-out {

  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* ============================ 参照・整形 ============================ */
const REPORT_FIELDS = [
  ["visit_type","対応区分"], ["work_done","作業内容"], ["issue","発生した事象・不具合"],
  ["action","対応・処置"], ["parts","使用・交換部品"], ["result","結果・動作確認"], ["handover","次回への申し送り"],
];
const byId = (arr) => Object.fromEntries(arr.map(x => [x.id, x]));
const HMAP = byId(HOSPITALS), DMAP = byId(DEVICES), EMAP = byId(ENGINEERS);
const hospOfDevice = (d) => HMAP[d.hospital_id];

function enrichReport(r) {
  const dev = DMAP[r.device_id], eng = EMAP[r.engineer_id], hosp = hospOfDevice(dev);
  return { ...r, dev, eng, hosp, when: new Date(r.submitted_at) };
}
function enrichTask(t) {
  const dev = DMAP[t.device_id], hosp = hospOfDevice(dev), eng = EMAP[t.assignee_id];
  return { ...t, dev, hosp, eng, dueDate: new Date(t.due) };
}
const R = REPORTS.map(enrichReport).sort((a,b) => b.when - a.when);
const T = TASKS.map(enrichTask).sort((a,b) => ({高:0,中:1,低:2}[a.priority]-{高:0,中:1,低:2}[b.priority]) || (a.dueDate-b.dueDate));

/* AI要約の状態（生成結果はセッション中キャッシュ） */
let SAMPLE = null;
const aiKarte = {};   // device_id -> 要約テキスト
const aiReport = {};  // report_id -> 要約テキスト

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtDT = (d) => `${fmtDate(d)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const mapUrl = (h) => `https://www.google.com/maps/search/?api=1&query=${h.lat},${h.lng}`;
const isOverdue = (t) => t.dueDate < NOW && t.status !== "完了";

function hue(str) { let h = 0; for (const ch of str) h = (h*31 + ch.charCodeAt(0)) % 360; return h; }
function avatar(name, cls="") {
  const h = hue(name);
  return `<span class="avatar ${cls}" style="background:hsl(${h} 42% 46%)">${esc((name||"?").trim()[0]||"?")}</span>`;
}
function photoTile(name) {
  const h = hue(name);
  return `<div class="photo" style="background:hsl(${h} 38% 45%)">📷<br>${esc(name)}</div>`;
}
const STATUS_CLASS = { "未対応":"b-untouched", "対応中":"b-progress", "完了":"b-done" };
const statusBadge = (s) => `<span class="badge ${STATUS_CLASS[s]||""}">${esc(s)}</span>`;
const prioTag = (p) => `<span class="prio prio-${p}">${p==="高"?"🔴":p==="中"?"🟡":"⚪"} ${esc(p)}</span>`;

function reportBodyHtml(r) {
  let h = "";
  for (const [k,label] of REPORT_FIELDS) {
    if (!r[k]) continue;
    h += `<div class="kv"><div class="label">${esc(label)}</div><div class="val">${esc(r[k])}</div></div>`;
  }
  if (r.photos && r.photos.length) {
    h += `<div class="kv"><div class="label">写真</div><div class="photos">${r.photos.map(photoTile).join("")}</div></div>`;
  }
  return h;
}
function reportCardHtml(r, showDevice=true) {
  const head = showDevice ? `${esc(r.hosp.name)} ／ ${esc(r.dev.name)}` : fmtDate(r.when);
  return `<details class="rcard">
    <summary>
      ${avatar(r.eng.name)}
      <span class="head-main">
        <span class="t">${head} <span class="badge b-visit">${esc(r.visit_type)}</span></span><br>
        <span class="m">${fmtDT(r.when)}　担当 ${esc(r.eng.name)}　<span class="mono">${esc(r.id)}</span></span>
      </span>
    </summary>
    <div class="body">
      <div class="kv"><div class="val">${esc(r.dev.model)} / SN:<span class="mono">${esc(r.dev.serial)}</span>　—　${esc(r.dev.location)}</div></div>
      ${reportBodyHtml(r)}
      <div class="ai-block" style="margin-top:14px;margin-bottom:0">
        <button class="ai-btn" data-ai-report="${r.id}">🧠 この報告をAI要約</button>
        <div class="ai-out" data-ai-out-report="${r.id}" ${aiReport[r.id]?"":"hidden"}>${aiReport[r.id]?esc(aiReport[r.id]):""}</div>
      </div>

  </details>`;
}

async function initSample() {
  try { if (window.claude && window.claude.use) SAMPLE = await claude.use("sample"); }
  catch (_) { SAMPLE = null; }
  document.body.classList.toggle("has-sample", !!SAMPLE);
}

function buildKartePrompt(dev, hosp, hist, tasks) {
  const L = [];
  L.push("あなたは医療機器のフィールドサービス記録を引き継ぐベテランエンジニアです。");
  L.push("以下は装置1台の「カルテ」（基本情報・未対応の残務・作業履歴）です。次に対応する担当者が短時間で状況を把握できるよう、日本語で簡潔に要約してください。");
  L.push("見出しは【現状】【繰り返し起きている事象・注意点】【未対応の残務】【次回訪問での推奨アクション】の4つ。各項目は2〜4行の箇条書き。記録にある事実のみを使い、推測や誇張はしないこと。");
  L.push("");
  L.push(`装置: ${dev.name} / 型番 ${dev.model} / SN ${dev.serial}`);
  L.push(`設置: ${hosp.name} ${dev.location} / 設置日 ${dev.installed_at} / 次回点検 ${dev.next_pm}`);
  L.push("");
  L.push("■ 未対応の残務");
  if (tasks.length) tasks.forEach(t => L.push(`- [${t.priority}] ${t.content}（期限 ${t.due} / 担当 ${t.eng.name}）${t.note ? " 備考: " + t.note : ""}`));
  else L.push("- なし");
  L.push("");
  L.push("■ 作業履歴（新しい順）");
  hist.forEach(r => {
    L.push(`◆ ${fmtDate(r.when)}［${r.visit_type}］担当 ${r.eng.name}`);
    for (const [k, label] of REPORT_FIELDS) { if (k !== "visit_type" && r[k]) L.push(`  - ${label}: ${r[k]}`); }
  });
  return L.join("\n").slice(0, 60000);
}

function buildReportPrompt(r) {
  const L = ["次の作業報告を、次の担当者が数秒で把握できるよう日本語で2〜3行に要約してください。記録の事実のみ。", ""];
  for (const [k, label] of REPORT_FIELDS) { if (r[k]) L.push(`${label}: ${r[k]}`); }
  return L.join("\n").slice(0, 60000);
}

function aiErrorText(e) {
  const hide = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
  if (hide.includes(e.code)) { document.body.classList.remove("has-sample"); return "この環境ではAI要約を利用できません。"; }
  if (e.code === "cancelled") return "";
  if (e.code === "rate_limited") return "混み合っています。少し時間をおいて再度お試しください。";
  if (e.code === "prompt_too_large") return "内容が多いため要約できませんでした。";
  return "要約に失敗しました。もう一度お試しください。";
}

async function runSample(btn, out, prompt, opts, cacheObj, cacheKey) {
  if (!SAMPLE) return;
  btn.disabled = true;
  out.hidden = false; out.classList.add("thinking"); out.textContent = "AIが要約中…（数秒〜1分ほどかかります）";
  try {
    const { text } = await SAMPLE(prompt, {
      ...opts,
      onText: ({ text }) => { out.classList.remove("thinking"); out.textContent = text; },
    });
    out.classList.remove("thinking"); out.textContent = text;
    cacheObj[cacheKey] = text;
  } catch (e) {
    const msg = aiErrorText(e);
    out.classList.remove("thinking");
    if (msg) out.textContent = msg; else out.hidden = true;
  } finally {
    btn.disabled = false;
  }
}

function setupAI() {
  document.getElementById("main").addEventListener("click", (ev) => {
    const kb = ev.target.closest("[data-ai-karte]");
    if (kb) {
      const id = kb.dataset.aiKarte, dev = DMAP[id], hosp = hospOfDevice(dev);
      const hist = R.filter(r => r.device_id === id);
      const tasks = T.filter(t => t.device_id === id && t.status !== "完了");
      const out = document.querySelector(`[data-ai-out-karte="${id}"]`);
      runSample(kb, out, buildKartePrompt(dev, hosp, hist, tasks), { modelTier: "default" }, aiKarte, id);
      return;
    }
    const rb = ev.target.closest("[data-ai-report]");
    if (rb) {
      const id = rb.dataset.aiReport, r = R.find(x => x.id === id);
      const out = document.querySelector(`[data-ai-out-report="${id}"]`);
      runSample(rb, out, buildReportPrompt(r), { modelTier: "quick" }, aiReport, id);
      return;
    }
  });
}

function wire() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("sel-hosp","change", e => { karteHosp = e.target.value; karteDev = null; render(); });
  on("sel-dev","change", e => { karteDev = e.target.value; render(); });
  on("rf-hosp","change", e => { repHosp = e.target.value; render(); });
  on("rf-eng","change", e => { repEng = e.target.value; render(); });
  on("rf-kw","input", e => { repKw = e.target.value; const l=document.querySelector(".stack"); if(!l) return;
    // 再描画（フォーカス維持のため入力欄は据え置き→簡易に全再描画）
    const pos = e.target.selectionStart; render();
    const nk = document.getElementById("rf-kw"); if(nk){ nk.focus(); nk.setSelectionRange(pos,pos); } });
  on("bf-hosp","change", e => { boardHosp = e.target.value; render(); });
}

render();
setupAI();
initSample();
</script>
